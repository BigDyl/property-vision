<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Property Vision</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    body { font-family: DM Sans, sans-serif; margin:0; padding:20px; background:#f7f3ec; }
    .card { background:#fff; padding:20px; border-radius:10px; max-width:800px; margin:20px auto; }
    .btn { padding:10px 15px; cursor:pointer; }
    .thumb { width:120px; height:90px; background:#ddd; margin:5px; display:inline-block; }
  </style>
</head>

<body>

<div class="card">
  <h2>Property Vision (Debug Stable Version)</h2>

  <input id="api-key" type="password" placeholder="OpenAI API Key" />

  <br><br>

  <input id="listing-url" type="text" placeholder="Paste listing URL" />
  <button onclick="fetchImages()">Extract images</button>

  <div id="url-grid"></div>
</div>

<script>
/* =========================
   GLOBAL STATE
========================= */
const S = {
  images: []
};

/* =========================
   SAFE INIT (CRITICAL FIX)
========================= */
function init() {
  const apiKeyInput = document.getElementById('api-key');
  if (apiKeyInput) {
    apiKeyInput.value = localStorage.getItem('pv_key') || '';
    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('pv_key', apiKeyInput.value);
    });
  }
}

document.addEventListener('DOMContentLoaded', init);

/* =========================
   STATUS SAFE HELPER
========================= */
function setStatus(msg) {
  console.log('[STATUS]', msg);
}

/* =========================
   IMAGE FETCH (SIMPLIFIED TEST VERSION)
   (we will plug real worker next step)
========================= */
async function fetchImages() {
  const url = document.getElementById('listing-url').value;
  const grid = document.getElementById('url-grid');

  if (!url) return alert('Paste a URL');

  grid.innerHTML = '';
  setStatus('Fetching (placeholder mode)...');

  // TEMP MOCK so UI works first
  const fakeImages = [
    'https://via.placeholder.com/400x300',
    'https://via.placeholder.com/400x301',
    'https://via.placeholder.com/400x302'
  ];

  fakeImages.forEach(src => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${src}" width="120">`;
    grid.appendChild(div);
  });

  setStatus('Loaded placeholder images');
}
</script>

</body>
</html>
