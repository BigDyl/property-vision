<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Property Vision</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

input, select {
  padding: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px 14px;
  border-radius: 6px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

#grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 3px solid transparent;
}

.selected {
  border: 3px solid #22c55e;
}

#result {
  margin-top: 20px;
  background: #111827;
  padding: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>Property Vision</h1>

<div class="row">
  <input id="url" placeholder="Paste listing URL" />
  <button onclick="loadImages()">Load Images</button>
</div>

<div class="row">
  <select id="style">
    <option value="modern luxury">Modern Luxury</option>
    <option value="scandinavian">Scandinavian</option>
    <option value="minimalist">Minimalist</option>
    <option value="industrial">Industrial</option>
    <option value="family home">Family Home</option>
  </select>

  <button onclick="generate()">Generate Vision</button>
</div>

<div id="grid"></div>

<div id="result">Result will appear here</div>

<script>
let images = [];
let selected = new Set();

const grid = document.getElementById("grid");
const result = document.getElementById("result");

function render() {
  grid.innerHTML = "";

  images.forEach((url, i) => {
    const img = document.createElement("img");
    img.src = url;

    if (selected.has(url)) {
      img.classList.add("selected");
    }

    img.onclick = () => {
      if (selected.has(url)) {
        selected.delete(url);
      } else {
        selected.add(url);
      }
      render();
    };

    grid.appendChild(img);
  });
}

async function loadImages() {
  const url = document.getElementById("url").value;

  const res = await fetch("https://property-vision-api.dylangeorgesmythe.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "scrape",
      url
    })
  });

  const data = await res.json();

  images = data.images || [];
  selected.clear();
  render();
}

async function generate() {
  const style = document.getElementById("style").value;

  const selectedImages = Array.from(selected);

  if (selectedImages.length === 0) {
    result.innerText = "Select at least one image";
    return;
  }

  result.innerText = "Generating...";

  const res = await fetch("https://property-vision-api.dylangeorgesmythe.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "generate",
      images: selectedImages,
      style
    })
  });

  const data = await res.json();

  result.innerText = data.result || JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
